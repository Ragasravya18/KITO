services:
  - type: web
    name: kit-kito-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: kito-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KIT_PARTICIPANT_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/kit.sqlite3
      - key: COOKIE_SECURE
        value: "true"
